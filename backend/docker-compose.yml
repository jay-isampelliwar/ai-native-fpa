# Production stack for the GCP e2-micro VM.
# Postgres is on Neon and Redis is on Upstash, so neither runs here.
# Run from backend/ on the VM:
#   docker compose --env-file .env.prod up -d --build
# Local development lives in infra/docker-compose.yml.

x-app: &app
  image: ai-native-fpa-backend
  env_file: .env.prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-after-api: &after-api
  api:
    condition: service_started

services:
  api:
    <<: *app
    build: .
    container_name: ai-native-fpa-api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  outbox:
    <<: *app
    container_name: ai-native-fpa-outbox
    command: ["python", "-m", "app.features.outbox.publisher"]
    depends_on: *after-api

  agent-worker:
    <<: *app
    container_name: ai-native-fpa-agent-worker
    command: ["python", "-m", "app.features.runs.consumer"]
    depends_on: *after-api
    stop_grace_period: 30s

  memory-worker:
    <<: *app
    container_name: ai-native-fpa-memory-worker
    command: ["python", "-m", "app.features.memory.worker"]
    depends_on: *after-api
    stop_grace_period: 30s

  caddy:
    image: caddy:2.8-alpine
    container_name: ai-native-fpa-caddy
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
