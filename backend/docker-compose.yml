x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:17
    container_name: ai-native-fpa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ai-native-fpa-backend-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ai-native-fpa-backend
    container_name: ai-native-fpa-api
    env_file: .env
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on: *app-depends
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  outbox:
    image: ai-native-fpa-backend
    container_name: ai-native-fpa-outbox
    command: ["python", "-m", "app.features.outbox.publisher"]
    env_file: .env
    environment: *app-env
    depends_on:
      <<: *app-depends
      api:
        condition: service_started
    restart: unless-stopped

  agent-worker:
    image: ai-native-fpa-backend
    command: ["python", "-m", "app.features.runs.consumer"]
    env_file: .env
    environment: *app-env
    depends_on:
      <<: *app-depends
      api:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

  memory-worker:
    image: ai-native-fpa-backend
    command: ["python", "-m", "app.features.memory.worker"]
    env_file: .env
    environment: *app-env
    depends_on:
      <<: *app-depends
      api:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
    name: ai-native-fpa-pgdata
    external: true
  redis_data:
    name: infra_redis_data
    external: true
