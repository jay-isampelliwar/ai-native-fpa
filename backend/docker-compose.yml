services:
  redis:
    image: redis:7.4-alpine
    container_name: ai-native-fpa-backend-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ai-native-fpa-backend
    container_name: ai-native-fpa-api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  outbox:
    image: ai-native-fpa-backend
    container_name: ai-native-fpa-outbox
    command: ["python", "-m", "app.features.outbox.publisher"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  agent-worker:
    image: ai-native-fpa-backend
    command: ["python", "-m", "app.features.runs.consumer"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

  memory-worker:
    image: ai-native-fpa-backend
    command: ["python", "-m", "app.features.memory.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  redis_data:
