[project]
name = "ai-native-fpa-backend"
version = "0.1.0"
description = "AI native financial planner - skill based LangGraph backend"
readme = "README.md"
authors = [
    { name = "Jay Isampelliwar", email = "isampelliwar79@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "pydantic",
    "pydantic-settings",
    "pycryptodome",
    "tenacity",
    "orjson",
    "langsmith",
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.19.2",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.4",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "hypothesis",
    "freezegun",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
